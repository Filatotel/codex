name: Verify Owner Interface structural repair

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner-interface-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: 673865e166867a1c4ed8790b862bce9d24afc7e8
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact head
        run: |
          test "$(git rev-parse HEAD)" = "673865e166867a1c4ed8790b862bce9d24afc7e8"
          git rev-parse HEAD
      - name: Owner Interface bounded tests
        run: python -m unittest tests.test_owner_interface_skills
      - name: Structural validation
        run: python tools/validate_structure.py
