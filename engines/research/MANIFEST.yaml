engine_id: research
status: available
default_research_mode: MACHINE_ONLY
constitutional_authority: kernel/RESEARCH_MACHINE_ONLY_CONSTITUTION.md
purpose: bounded machine-only research, evidence synthesis, and read-only reconciliation of durable Research outputs
owns:
  - research_question_admission
  - research_planning
  - machine_research_execution
  - evidence_extraction
  - finding_synthesis
  - machine_experiment
  - research_gap_analysis
  - research_release_preparation
  - research_chain_reconciliation
does_not_own:
  - k0
  - owner_authority
  - canon_acceptance
  - canon_mutation
  - default_human_research
  - third_party_human_recruitment
  - global_control_direction
  - research_dispatch
inputs:
  - owner_or_canon_input
  - relevant_state_slice
  - exact_assignment
  - destination_capability_profile
  - assignment_admissibility
  - exact_durable_research_artifact_refs_for_reconciliation
  - downstream_requirement_refs_for_reconciliation
outputs:
  - admitted_research_questions
  - machine_research_work_packages
  - sources
  - evidence
  - findings
  - research_release
  - research_chain_reconciliation
  - canon_reconciliation_package
entry_conditions:
  - required_authority_is_present
  - relevant_state_slice_is_identified
  - question_or_work_package_passes_machine_only_admission_when_research_execution_is_selected
  - reconciliation_uses_exact_durable_upstream_refs_when_reconcile_research_chain_is_selected
  - destination_executability_preflight_passes_for_execution_assignment
exit_conditions:
  - research_outputs_are_verified
  - limitations_are_explicit
  - owner_gate_is_used_only_for_project_authority
required_dependencies:
  - kernel/RESEARCH_MACHINE_ONLY_CONSTITUTION.md
  - contracts/CORE_CONTRACTS.md
  - contracts/EXECUTABILITY_CONTRACT.md
  - engines/research/RESEARCH_CONTROL_CONTRACT.md
  - engines/research/ROLES.md
  - engines/research/bootstrap/DEFAULT_MACHINE_ONLY_BOOTSTRAP.yaml
  - schemas/research-question.schema.json
  - schemas/research-work-package.schema.json
  - schemas/machine-experiment.schema.json
  - schemas/research-method-freeze.schema.json
  - schemas/research-source.schema.json
  - schemas/human-research-authorization.schema.json
  - schemas/owner-decision-record.schema.json
  - engines/research/schemas/research-chain-reconciliation.schema.json
  - engines/research/skills/reconcile-research-chain/SKILL.md
  - tools/research_policy.py
  - tools/validate_structure.py
workflows:
  default_machine_research: engines/research/workflows/default-machine-research.md
  research_chain_reconciliation: engines/research/workflows/research-chain-reconciliation.md
roles:
  owner: OWNER_K0
  liaison: AI_R_LIAISON
  foundation: AI_R0_ARCH
  question_scope: AI_R_WHAT
  source_strategy: AI_R_WHERE
  executor: AI_R_MASTER
  evidence_extractor: AI_EVIDENCE_EXTRACTOR
  synthesis: AI_SYNTHESIS_AGENT
  verifier: AI_R_VERIFIER
  repair: AI_R_REPAIR
  adversarial_validator: AI_ADVERSARIAL_VALIDATOR
  release_controller: AI_RESEARCH_RELEASE_CONTROLLER
capabilities:
  admit_research_question: default_machine_research
  plan_research_work: default_machine_research
  execute_research_work: default_machine_research
  run_research_experiment: default_machine_research
  verify_research_work: default_machine_research
  prepare_research_release: default_machine_research
  reconcile_research_chain: research_chain_reconciliation
validation_bindings:
  question: validate_question
  work_package: validate_work_package
  source: validate_source
  experiment: validate_experiment
  method_freeze: validate_method_freeze
  separate_human_research_authorization: validate_human_research_authorization
  structural_regression_gate: tools/validate_structure.py
reconciliation_semantics:
  artifact_type: RESEARCH_CHAIN_RECONCILIATION
  schema: engines/research/schemas/research-chain-reconciliation.schema.json
  template: engines/research/templates/RESEARCH_CHAIN_RECONCILIATION.yaml
  exact_upstream_refs_required: true
  requirement_specific_dependency_state: true
  gap_to_repeat_is_automatic: false
  candidate_frontier_is_dispatch_authority: false
  research_work_package_admission_required_for_reconciliation: false
  canon_mutation_authority: false
default_deny:
  third_party_human_research: true
  owner_manual_research_labor: true
  external_human_review: true
  new_human_data_collection: true
separate_human_research:
  reachable_from_default_workflow: false
  required_owner_authorization_validator: validate_human_research_authorization
  required_owner_decision_record: OWNER_DECISION_RECORD
  namespace_prefix: human-research/
  non_transitive: true
  default_research_mode_unchanged: true
executability_semantics:
  MACHINE_EXECUTABLE: method_level_machine_only_admission_not_destination_proof
  CAN_EXECUTE_WITH_AVAILABLE_MACHINE_METHODS: method_level_machine_only_admission_not_destination_proof
  destination_runtime_authority: contracts/EXECUTABILITY_CONTRACT.md
  preflight_fields:
    - EXECUTION_SURFACE
    - SOURCE_ACCESS_METHOD
    - COMPUTATION_METHOD
    - VERIFICATION_METHOD
    - mandatory_validators
  known_missing_before_assignment: ASSIGNMENT_NOT_ADMISSIBLE
  lost_after_valid_assignment: BLOCKED_RUNTIME_DRIFT
