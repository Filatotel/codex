engine_id: verification
status: available
purpose: independent claim verification
owns:
  - completion_claim_verification
  - exact_candidate_claim_verification
does_not_own:
  - implementation
  - repair
  - owner_authority
  - canon_truth
  - product_state_mutation
inputs:
  - exact_assignment
  - executor_result
  - evidence_or_direct_state
  - destination_capability_profile
  - assignment_admissibility
outputs:
  - verification_result
entry_conditions:
  - explicit_claim_or_acceptance_target_exists
  - destination_executability_preflight_passes_for_mandatory_evidence
exit_conditions:
  - claim_by_claim_verdict_emitted
allowed_dependencies:
  - kernel/skills/exact-state-verification/
  - kernel/skills/evidence-and-authority/
  - contracts/EXECUTABILITY_CONTRACT.md
  - roles/control-verifier/ROLE.md
  - schemas/verification-result.schema.json
roles:
  - roles/control-verifier/ROLE.md
workflows:
  completion_claim_verification: engines/verification/workflows/completion-claim-verification.md
skill_namespaces:
  verification_skills: engines/verification/skills/
  shared_core: kernel/skills/
capabilities:
  verify_completion_claim: completion_claim_verification
  verify_exact_candidate_claims: completion_claim_verification
execution_contract:
  rule: preflight_every_mandatory_claim_and_evidence_path_before_assignment
  unavailable_after_valid_assignment: BLOCKED_RUNTIME_DRIFT
  known_unavailable_before_assignment: ASSIGNMENT_NOT_ADMISSIBLE
  evidence_strength_may_not_be_silently_weakened: true
